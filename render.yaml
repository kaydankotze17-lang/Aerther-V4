services:
  - type: web
    name: aether-dashboard
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: .
    healthCheckPath: /
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: LAVALINK_HOST
        fromService:
          type: pserv
          name: aether-lavalink
          property: host
      - key: LAVALINK_PORT
        value: "2333"
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        value: "false"
      - key: DASHBOARD_PORT
        value: "3000"
      - key: SESSION_SECRET
        generateValue: true

  - type: worker
    name: aether-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: LAVALINK_HOST
        fromService:
          type: pserv
          name: aether-lavalink
          property: host
      - key: LAVALINK_PORT
        value: "2333"
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        value: "false"

  - type: pserv
    name: aether-lavalink
    runtime: docker
    dockerfilePath: ./lavalink/Dockerfile
    dockerContext: ./lavalink
    plan: starter
